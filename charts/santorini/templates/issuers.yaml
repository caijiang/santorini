#file: noinspection KubernetesUnknownResourcesInspection

# 定义一个通用的 ClusterIssuer 用于集群内证书的申请
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "santorini.issuer" . }}
  labels:
    {{- include "common.labels.withoutName" . | nindent 4 }}
spec:
  acme:
    # You must replace this email address with your own.
    # Let's Encrypt will use this to contact you about expiring
    # certificates, and issues related to your account.
    email: "{{- include "santorini.masterEmail" . }}"
    # ACME 证书 profile（Let's Encrypt 支持 classic / tlsserver / shortlived）。
    # 必须用 classic：tlsserver（45 天）与 shortlived（约 6 天）都会【省略 Common Name】，
    # 叶子证书的 Subject 变成空序列 → 阿里云 CAS 的 UploadUserCertificate 会直接报
    # 「没有 commonName」（CAS 从 Subject 的 CN 推导主域名），证书传不进证书池，
    # ALB 也就引用不到。classic 会把 CSR 指定的 CN（未指定则第一个 SAN）写入 Subject。
    # ⚠️ 若将来 classic 也取消 CN，先确认 CAS 已支持无 CN 证书再切。
    profile: classic
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # Secret resource that will be used to store the account's private key.
      # This is your identity with your ACME provider. Any secret name may be
      # chosen. It will be populated with data automatically, so generally
      # nothing further needs to be done with the secret. If you lose this
      # identity/secret, you will be able to generate a new one and generate
      # certificates for any/all domains managed using your previous account,
      # but you will be unable to revoke any certificates generated using that
      # previous account.
      name: "{{ include "santorini.issuer" . }}-account-key"
    # Add a single challenge solver, HTTP01 using nginx
    solvers:
      - http01:
          ingress:
            # 可通过 kubectl get ingressclass 确定
            ingressClassName: nginx
    # dns01 还不会新版本再说